name: tmp onyx sdk probe
on:
  push:
    branches: [ boox-noteair4c-reader-cleanup ]
    paths: [ '.github/workflows/tmp-onyx-probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=http://repo.boox.com/repository/maven-public/com/onyx/android/sdk
          note() { msg=$(printf '%s' "$2" | head -c 4000 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::notice title=$1::$msg"; }
          curl -sSL -o dev.aar $B/onyxsdk-device/1.3.6/onyxsdk-device-1.3.6.aar
          mkdir aar && cd aar && unzip -q ../dev.aar && unzip -q classes.jar -d cls && cd ..
          J="javap -c -p -cp aar/cls"
          # Methods in SDMDevice and their reflective lookups (ldc strings + invoke targets)
          $J com.onyx.android.sdk.device.SDMDevice > sdm.txt 2>&1
          note sdm_methods "$(grep -E '^  (public|private|protected|static).*\(' sdm.txt | grep -iE 'refresh|repaint|invalidate|updatemode|waveform|scheme|fast' | head -40)"
          note sdm_strings "$(grep -oE 'String [A-Za-z_.]+' sdm.txt | sort | uniq -c | sort -rn | head -80 | paste -sd' ')"
          for m in refreshScreen repaintEverything invalidate setViewDefaultUpdateMode; do
            note "sdm_$m" "$(awk -v m="$m" '/^  [a-z].*\(/{name=$0} $0 ~ "String "m"$" {print name; for(i=0;i<0;i++)print}' sdm.txt | sort -u | head -10)"
          done
          note sdm_static_init "$(awk '/static \{\};/,/^$/' sdm.txt | grep -E 'String|Class|getMethod|Field|Integer' | head -120 | sed 's/^ *//' | paste -sd' ')"
          $J com.onyx.android.sdk.api.device.epd.EpdController > epd.txt 2>&1
          note epd_sigs "$(grep -E '^  public static' epd.txt | sed 's/public static //;s/ *$//' | grep -iE 'refresh|repaint|invalidate|mode|post|scheme' | head -50)"
