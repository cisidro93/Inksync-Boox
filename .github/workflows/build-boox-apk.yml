name: Build & Publish Boox E-Ink APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-boox-apk:
    name: Compile InkSync Boox APK (Free Public Linux Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble Debug APK for Boox Note Air 4C
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface Kotlin compiler errors and failed tests as annotations on the run / PR.
          grep -E '^e: |FAILED|AssertionError|Exception' build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # Gradle's explanation of the failure, as one annotation
          msg=$(awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$msg" ] && echo "::error title=What went wrong::${msg}" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkSync-Boox-NoteAir4C-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Latest Over-The-Air APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: latest-boox
          name: "InkSync Boox · Latest Note Air 4C Build"
          body: |
            Automated build for **Onyx Boox Note Air 4C** (Kaleido 3 Color E-Ink + Wacom EMR).
            Download `app-debug.apk` directly in your Boox browser or push via `adb install`.
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
